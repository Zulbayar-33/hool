<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>АКУМА • Хоолны бүртгэл</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="topbar"><div class="brand"><div class="logo">A</div><div><h1>АКУМА ХООЛНЫ БҮРТГЭЛ</h1><p>Ажилтны цахим бүртгэлийн систем</p></div></div><a class="btn btn-soft" href="admin.html">Admin</a></header><section id="loginCard" class="card auth"><h2>Тавтай морилно уу</h2><p class="muted">Ажилтны код болон нууц үгээ оруулна уу.</p><div class="field"><label>Ажилтны код</label><input id="code" class="input" autocomplete="username"></div><div class="field"><label>Нууц үг</label><input id="password" type="password" class="input" autocomplete="current-password"></div><button id="loginBtn" class="btn btn-primary btn-full">Нэвтрэх</button><div id="loginMsg"></div></section><section id="appCard" class="card app-card hidden"><div class="user-row"><div><p class="muted">Сайн байна уу</p><h2 id="userName" style="margin:3px 0"></h2><span id="userJob" class="muted"></span></div><div><button id="totalBtn" class="btn btn-soft">Миний нийт дүн</button> <button id="logoutBtn" class="btn btn-danger">Гарах</button></div></div><div class="rule"><b>Цагийн дүрэм:</b> FitFood болон Хоол 11:30-аас хойш Pending болж, admin зөвшөөрнө. ServiceFood цагийн хязгааргүй.</div><div class="grid"><div class="field"><label>Огноо</label><input id="foodDate" type="date" class="input"></div><div class="field"><label>ServiceFood үнэ</label><input id="amount" type="number" min="0" class="input" placeholder="Зөвхөн ServiceFood сонгоход"></div></div><div class="field"><label>Хоолны төрөл</label><div class="food-options"><label class="food-option"><input type="radio" name="food" value="fit" checked><span>🥗 FitFood</span></label><label class="food-option"><input type="radio" name="food" value="service"><span>🍱 ServiceFood</span></label><label class="food-option"><input type="radio" name="food" value="hool"><span>🍲 Хоол</span></label></div></div><button id="saveBtn" class="btn btn-primary btn-full">Бүртгэж хадгалах</button><div id="saveMsg"></div><div id="totalBox"></div></section></main><script src="config.js"></script><script src="api.js"></script><script src="app.js"></script></body></html>
