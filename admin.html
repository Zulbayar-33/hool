<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>АКУМА • Admin Dashboard</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section id="adminLogin" class="card auth"><div class="brand"><div class="logo">A</div><div><h1>ADMIN DASHBOARD</h1><p>Удирдлагын нууц үгээр нэвтэрнэ үү</p></div></div><div class="field"><label>Admin нууц үг</label><input id="adminPassword" type="password" class="input"></div><button id="adminLoginBtn" class="btn btn-primary btn-full">Нэвтрэх</button><div id="loginMsg"></div></section><div id="dashboard" class="hidden"><header class="topbar"><div class="brand"><div class="logo">A</div><div><h1>ADMIN DASHBOARD</h1><p>Хоолны бүртгэл, гүйцэтгэл ба лог</p></div></div><div><a class="btn btn-soft" href="index.html">Бүртгэл рүү</a> <button id="refreshBtn" class="btn btn-primary">Шинэчлэх</button></div></header><section class="stats"><div class="card stat"><small>FitFood нийт</small><strong id="fitStat">0</strong></div><div class="card stat"><small>ServiceFood нийт дүн</small><strong id="serviceStat">0₮</strong></div><div class="card stat"><small>Хоол нийт</small><strong id="hoolStat">0</strong></div><div class="card stat"><small>Өглөөний цай нийт</small><strong id="breakfastStat">0</strong></div><div class="card stat"><small>Өглөөний цай нийт үнэ</small><strong id="breakfastMoneyStat">0₮</strong></div><div class="card stat"><small>Нийт хоол</small><strong id="totalFoodStat">0</strong></div><div class="card stat"><small>Нийт мөнгөн дүн</small><strong id="totalMoneyStat">0₮</strong></div><div class="card stat"><small>Pending</small><strong id="pendingStat">0</strong></div></section><section class="admin-grid"><div class="card panel"><div class="panel-head"><h2>Бүртгэлийн мэдээлэл</h2><div class="filters"><select id="sheetFilter" class="input"><option value="all">Бүх төрөл</option><option>FitFood</option><option>ServiceFood</option><option>Hool</option><option>OglooniiTsai</option></select><input id="search" class="input" placeholder="Нэр, код хайх"></div></div><div id="tableBox" class="table-wrap"></div></div><aside class="card panel"><div class="panel-head"><h2>Сүүлийн лог</h2><span class="badge blue">Logs</span></div><div id="logs" class="log-list"></div></aside></section><div id="adminMsg"></div></div></main><script src="config.js"></script><script src="api.js"></script><script src="admin.js"></script></body></html>
